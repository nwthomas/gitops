global:
  imageRegistry: ""
  imagePullSecrets: []

server:
  service:
    type: ClusterIP

controller:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

applicationSet:
  enabled: true

rbac:
  create: true

namespace:
  create: true
  name: argocd
