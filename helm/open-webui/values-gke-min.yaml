nameOverride: ""
namespaceOverride: ""

ollama:
  enabled: false
  fullnameOverride: "open-webui-ollama"

pipelines:
  enabled: false
  extraEnvVars: []

tika:
  enabled: false

ollamaUrls: []

websocket:
  enabled: false
  manager: redis
  url: redis://open-webui-redis:6379/0
  redis:
    enabled: true
    name: open-webui-redis
    labels: {}
    annotations: {}
    image:
      repository: redis
      tag: 7.4.2-alpine3.21
      pullPolicy: IfNotPresent
    command: []
    args: []
    resources: {}
    service:
      containerPort: 6379
      type: ClusterIP
      labels: {}
      annotations: {}
      portName: http
      port: 6379
      nodePort: ""

clusterDomain: cluster.local
extraLabels: {}
annotations: {}
podAnnotations: {}
podLabels: {}
replicaCount: 1
strategy: {}
image:
  repository: ghcr.io/open-webui/open-webui
  tag: ""
  pullPolicy: "IfNotPresent"

serviceAccount:
  enable: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

imagePullSecrets: []

livenessProbe: {}

readinessProbe: {}

startupProbe: {}

resources: {}

copyAppData:
  resources: {}

managedCertificate:
  enabled: true
  name: "mydomain-chat-cert"
  domains:
    - chat.example.com

ingress:
  enabled: true
  class: ""
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "open-webui-external-ip"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://chat.example.com"
    networking.gke.io/managed-certificates: "mydomain-chat-cert"
  host: "chat.example.com"
  additionalHosts: []
  tls: false
  existingSecret: ""
persistence:
  enabled: true
  size: 2Gi
  existingClaim: ""
  subPath: ""
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  selector: {}
  annotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

service:
  type: LoadBalancer
  annotations: {}
  port: 80
  containerPort: 8080
  nodePort: ""
  labels: {}
  loadBalancerClass: ""

openaiBaseApiUrl: ""

extraEnvVars:
  - name: OPENAI_API_KEY
    value: "0p3n-w3bu!"

volumeMounts:
  initContainer: []
  container: []

volumes: []

podSecurityContext:
  {}

containerSecurityContext:
  {}

extraResources:
  []
