replicas: 1

image:
  repository: grafana/grafana
  tag: latest

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

service:
  type: LoadBalancer

sealedSecret:
  create: true
  encryptedData:
    loadBalancerIP: ""

patchJob:
  create: true
  image: bitnami/kubectl:latest

nodeSelector:
  node-type: worker

securityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

storage:
  storageClassName: "longhorn"
  size: "10Gi"
