{{- if and .Values.sealedSecret.create .Values.sealedSecret.encryptedData.loadBalancerIP -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-lb-ip
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  encryptedData:
    loadBalancerIP: {{ .Values.sealedSecret.encryptedData.loadBalancerIP }}
  template:
    metadata:
      name: grafana-lb-ip
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
